name = "infinite-canvas-collab-server"
main = "src/index.ts"
compatibility_date = "2024-12-31"

# Durable Object 绑定
durable_objects.bindings = [
  { name = "CANVAS_ROOM", class_name = "CanvasRoom" }
]

# D1 migrations 目录

# Durable Object 迁移
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CanvasRoom"]

# D1 数据库绑定（运行 wrangler d1 create 后填写 database_id）
[[d1_databases]]
binding = "DB"
database_name = "canvas_db"
database_id = "58c42c3b-2d31-4b00-bc14-428fba215697"

# R2 对象存储绑定（需先在 Cloudflare 控制台创建 bucket）
[[r2_buckets]]
binding = "R2"
bucket_name = "canvas-snapshots"
preview_bucket_name = "canvas-snapshots"

# 环境变量
[vars]
TOKEN_SECRET = "0b7e12a9f5c84d23a6b1f9a0c3e7b8d9f4a1c6e2b7d9f3a0c5e8b1d6f2a9c4e7"
SNAPSHOT_INTERVAL = "30000"  # 每 30 秒快照一次（毫秒）
SNAPSHOT_OP_THRESHOLD = "50"  # 每 50 个操作快照一次
EXTERNAL_API_KEYS = "{\"key_dev_1\": {\"secret\": \"secret_dev_1\", \"sources\": [\"external.crm\"]}}"
EXTERNAL_API_TIME_WINDOW_SEC = "300"
EXTERNAL_API_RATE_LIMIT_COUNT = "60"
EXTERNAL_API_RATE_LIMIT_WINDOW_SEC = "60"
EXTERNAL_API_NONCE_TTL_SEC = "300"

# DO优化配置
IDLE_TIMEOUT_MS = "500000"  # 5分钟用户空闲超时
EMPTY_ROOM_TIMEOUT_MS = "60000"  # 1分钟空房间超时
IDLE_CHECK_INTERVAL_MS = "60000"  # 60秒检查一次空闲连接
